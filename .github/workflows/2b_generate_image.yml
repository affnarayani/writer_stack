name: 2B. Generate Image

on:
  workflow_dispatch: # Manual button also available
  workflow_run:
    workflows: ["2A. Generate Content"]
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-image-automation:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0 # Full history fetch for safe dynamic push

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull Latest Changes (Maintain Persistence)
      run: |
        git pull origin ${GITHUB_REF_NAME} --rebase

    - name: Install and Start Cloudflare WARP (TUN Global Mode)
      run: |
        # 1. Set up repository and GPG key
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

        # 2. Install
        sudo apt-get update && sudo apt-get install -y cloudflare-warp

        # 3. Start Service
        sudo systemctl start warp-svc
        sleep 2

        # 4. Register (New CLI Syntax compatible)
        warp-cli --accept-tos registration new || warp-cli registration new

        # 5. STRICT FIX: Switch mode from PROXY to TUN (Standard VPN)
        # This will route all GitHub runner internet traffic through WARP
        warp-cli --accept-tos mode warp || warp-cli mode warp

        # 6. Connect
        warp-cli --accept-tos connect || warp-cli connect
        sleep 5

        # 7. Verify if the system IP has changed
        curl https://cloudflare.com/cdn-cgi/trace

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Run Image Script
      env:
        DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python generate_image.py

    - name: Upload Error Screenshot
      if: failure() # This step runs only if the above step fails
      uses: actions/upload-artifact@v4
      with:
        name: playright-error-screenshot
        path: error/error_screenshot.png
        if-no-files-found: ignore

    - name: Commit and Push Generated Image (If downloaded)
      run: |
        # Check if image/pin.png was created or updated
        git add image/pin.png

        # Stage locator / config files (auto-correct + vision suggestions)
        [ -f locators/substack_locators.txt ] && git add locators/substack_locators.txt
        [ -f locators/chatgpt_locators.txt ] && git add locators/chatgpt_locators.txt
        [ -f locators/changed_locators.json ] && git add locators/changed_locators.json
        [ -f json/config.json ] && git add json/config.json

        if git diff --staged --quiet; then
          echo "[INFO] No image changes detected. Skipping push."
        else
          echo "[OK] New image detected. Committing and pushing updates..."
          git commit -m "Automated: Update generated header image [skip ci]"
          git pull origin ${GITHUB_REF_NAME} --rebase
          git push origin ${GITHUB_REF_NAME}
        fi
