name: 4A. Post Notes

on:
  workflow_dispatch: # Run manually when needed
  schedule:
    - cron: '0 12,16,23 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-script:
    runs-on: ubuntu-latest # Linux container runs fast and efficient

    steps:
      # 1. Checkout repository code
      - name: Checkout repository code
        uses: actions/checkout@v5

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull Latest Changes (Maintain Persistence)
        run: |
          git pull origin ${GITHUB_REF_NAME} --rebase

      - name: Install and Start Cloudflare WARP (TUN Global Mode)
        run: |
          # 1. Set up repository and GPG key
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          # 2. Install
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

          # 3. Start Service
          sudo systemctl start warp-svc
          sleep 2

          # 4. Register (New CLI Syntax compatible)
          warp-cli --accept-tos registration new || warp-cli registration new

          # 5. STRICT FIX: Switch mode from PROXY to TUN (Standard VPN)
          # This will route all GitHub runner internet traffic through WARP
          warp-cli --accept-tos mode warp || warp-cli mode warp

          # 6. Connect
          warp-cli --accept-tos connect || warp-cli connect
          sleep 5

          # 7. Verify if the system IP has changed
          curl https://cloudflare.com/cdn-cgi/trace

      # 4. Install Python Packages/Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade playwright

      # 5. Install Playwright Chromium and system dependencies
      - name: Install Playwright Chromium and system dependencies
        run: |
          python -m playwright install chromium --with-deps

      # 6. Run script and pass environment secret
      - name: Execute Automation Script
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python post_notes.py

      # 7. Upload error screenshot if script fails
      - name: Upload Error Screenshot if script fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: substack-notes-error-screenshot
          path: error/error_screenshot.png
          retention-days: 7

      # 8. Commit changes back to GitHub (always, so locator auto-corrects persist on failure)
      - name: Commit and Push updated files
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # json/notes.json (where state _posted: true) and json/article.json (when all notes are done, key cleared)
          git add json/notes.json json/article.json

          # Stage locator / config files (auto-correct + vision suggestions)
          [ -f locators/substack_locators.txt ] && git add locators/substack_locators.txt
          [ -f locators/chatgpt_locators.txt ] && git add locators/chatgpt_locators.txt
          [ -f locators/changed_locators.json ] && git add locators/changed_locators.json
          [ -f json/config.json ] && git add json/config.json

          if git diff --staged --quiet; then
            echo "[INFO] No tracking changes detected. Skipping commit."
          else
            echo "[OK] Staged changes found. Committing and pushing updates..."
            git commit -m "chore: update notes posting queue state [skip ci]"
            git pull origin ${GITHUB_REF_NAME} --rebase
            git push origin ${GITHUB_REF_NAME}
          fi
